[package]
name = "argus_flowlog_engine"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hosts one FlowLog program's incremental dataflow for argus."

# A workspace of its own: argus copies this crate into a cache directory
# per program, and builds each copy with this lockfile (`--locked`).
[workspace]

# argus renames the binary per program, so programs built into one shared
# target directory never overwrite each other's executable.
[[bin]]
name = "argus-flowlog-engine"
path = "src/main.rs"

[dependencies]
flowlog-runtime = { git = "https://github.com/QuinnWilton/flowlog", rev = "2393ede803b14710b8752de7e82041bb55b7da10" }
itoa = "1.0"
libc = "0.2"
mimalloc = "0.1"
rustc-hash = "2.0"
serde_json = "1.0"

[profile.release]
# Generated programs are tens of thousands of lines of Differential
# Dataflow, and compiling one is most of a first run's cost. Measured on
# argus's largest analysis (races): turning cross-unit LTO off took its
# build from 331s to 208s; opt-level 1 built only 10% faster than 2 and
# solved 5% slower, and 3 matched 2; 16 and 256 codegen units built
# slower than 64. Most of the time is LLVM over operators instantiated
# once per row type, which no profile setting changes.
opt-level = 2
lto = "off"
codegen-units = 64
# Each program's crate is built once, from a directory of its own:
# incremental artifacts would only fill the cache.
incremental = false
# A panic is reported by the exit status and the engine's log; no unwinding
# leaves a half-applied transaction behind.
panic = "abort"

# For programs that are solved over a handful of rows, such as a test's
# (`ARGUS_FLOWLOG_BUILD_PROFILE=quick`): the program's own crate is not
# optimized, and its dependencies are, as in release. Measured on stage
# 0: the engine compiled in 3.0s instead of 8.4s, with a seventh of the
# CPU time, and solved 47 MB of facts in 0.59s instead of 0.17s.
# opt-level 1 compiled only 15% faster than release.
[profile.quick]
inherits = "release"
opt-level = 0

[profile.quick.package."*"]
opt-level = 2
