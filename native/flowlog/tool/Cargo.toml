[package]
name = "argus_flowlog_tool"
version = "0.1.0"
edition = "2024"
publish = false
description = "Inspects FlowLog programs and generates the engines argus runs them in."

# A workspace of its own: argus builds this crate in a cache directory,
# never inside a parent project's workspace.
[workspace]

[[bin]]
name = "argus-flowlog-tool"
path = "src/main.rs"

[dependencies]
flowlog-build = { git = "https://github.com/QuinnWilton/flowlog", rev = "09b7eb1bd17b731f04dc0d198ef39bedbd8f8c01" }
flowlog-common = { git = "https://github.com/QuinnWilton/flowlog", rev = "09b7eb1bd17b731f04dc0d198ef39bedbd8f8c01" }
flowlog-parser = { git = "https://github.com/QuinnWilton/flowlog", rev = "09b7eb1bd17b731f04dc0d198ef39bedbd8f8c01" }
flowlog-planner = { git = "https://github.com/QuinnWilton/flowlog", rev = "09b7eb1bd17b731f04dc0d198ef39bedbd8f8c01" }
flowlog-runtime = { git = "https://github.com/QuinnWilton/flowlog", rev = "09b7eb1bd17b731f04dc0d198ef39bedbd8f8c01" }
itoa = "1.0"
libc = "0.2"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
mimalloc = "0.1"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde", "union", "const_generics"] }

[profile.release]
opt-level = 2
# The generic engine (`serve`) runs here: a panic, a division by zero
# say, ends it as it would a compiled engine, never leaving a worker
# half through a commit.
panic = "abort"
