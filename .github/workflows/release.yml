# A DRAFT release: builds the argus escript and its sha256, and each
# platform's bundle of prebuilt FlowLog engines (`mix argus.flowlog
# bundle`), and attaches them all, with `prebuilt.json` naming the
# bundles by URL and SHA-256, to a draft GitHub release for a person to
# review and publish. Run by hand only (Actions → Release → Run
# workflow): nothing triggers it, and it publishes nothing on its own.
# The rebar3 plugin downloads `argus` and `argus.sha256` from a
# published release's assets ({argus_plugin, [{version, V}]}).
#
# Before `mix hex.publish`, commit the draft's `prebuilt.json` as
# `priv/flowlog/prebuilt.json` on the release's commit: argus reads it at
# compile time, and it changes no program's digest, so the bundles stay
# the package's. A package without it builds every engine with Rust.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (the tag is v<version>; mix.exs must say the same)"
        required: true

permissions:
  contents: write

jobs:
  engines:
    name: Prebuilt engines (${{ matrix.triple }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          # GitHub retired macos-13; this is its last x86_64 image.
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          # Linux's are built for musl and linked static: one runs on every
          # Linux of its architecture, glibc or musl, of any age, and on
          # NixOS, needing no loader or C library of the system's.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-musl
            static: true
          - os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-musl
            static: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The musl target, its C compiler (mimalloc is C), and the target for
      # every build (`Argus.FlowLog.Toolchain.build_target/0`).
      - name: Set up the static build
        if: matrix.static
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.triple }}"
          echo "ARGUS_FLOWLOG_TARGET=${{ matrix.triple }}" >> "$GITHUB_ENV"
          echo "CC_$(echo "${{ matrix.triple }}" | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: mix deps.get

      - name: Build the bundle
        run: mix argus.flowlog bundle bundles
        env:
          MIX_ENV: prod
          ARGUS_FLOWLOG_DIR: ${{ runner.temp }}/flowlog

      - name: Check the bundle is this platform's
        run: test -f "bundles/argus-flowlog-${{ matrix.triple }}.tar.gz"

      # Every executable static, and the tool running where a dynamically
      # linked one does not: Alpine (musl), NixOS (no FHS loader) and
      # Debian 11 (glibc 2.31). Run bare, the tool prints its usage and
      # exits 2.
      - name: Check the static bundle runs on other Linuxes
        if: matrix.static
        run: |
          mkdir check && tar xzf "bundles/argus-flowlog-${{ matrix.triple }}.tar.gz" -C check
          if file check/bin/argus-flowlog-tool check/engines/*/engine | grep 'dynamically linked'; then
            echo "an executable above is not static"; exit 1
          fi
          for image in alpine:3 nixos/nix:latest debian:bullseye-slim; do
            code=0
            docker run --rm -v "$PWD/check:/bundle:ro" "$image" /bundle/bin/argus-flowlog-tool || code=$?
            if [ "$code" != 2 ]; then echo "the tool exits $code on $image"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.triple }}
          path: bundles/
          if-no-files-found: error

  escript:
    name: Build the escript
    needs: engines
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Check the version
        run: |
          grep -q "@version \"${{ inputs.version }}\"" mix.exs ||
            { echo "mix.exs does not say version ${{ inputs.version }}"; exit 1; }

      - name: Install dependencies
        run: mix deps.get

      - uses: actions/download-artifact@v4
        with:
          pattern: engines-*
          path: bundles
          merge-multiple: true

      # Before the escript: argus compiles the offer in, so the escript
      # fetches the bundles as the package does.
      - name: Name the bundles
        run: >-
          mix argus.flowlog prebuilt
          "https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}"
          bundles/*.tar.gz.json
          && cp priv/flowlog/prebuilt.json prebuilt.json
        env:
          MIX_ENV: prod

      - name: Build the escript
        run: mix escript.build
        env:
          MIX_ENV: prod

      - name: Checksum
        run: sha256sum argus | cut -d' ' -f1 > argus.sha256

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}" argus argus.sha256 prebuilt.json bundles/*.tar.gz
          --draft --title "argus ${{ inputs.version }}"
          --notes "The argus escript (needs Erlang/OTP 28), and prebuilt FlowLog engines for macOS and Linux on arm64 and x86_64 (static on Linux, for any distribution, NixOS included): argus's own analyses need no Rust there. A program of your own needs Rust 1.88 or newer (https://rustup.rs). Check the escript with: sha256sum -c <(echo \"$(cat argus.sha256)  argus\"). Before publishing the package, commit prebuilt.json as priv/flowlog/prebuilt.json."
