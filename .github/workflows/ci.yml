name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run credo
        run: mix credo --strict

  test:
    name: Test / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.19.4"]
        otp: ["28.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install Souffle
        run: |
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      # Compiled in :dev so the check covers the library alone: the test
      # fixtures deliberately declare behaviours from packages argus does
      # not depend on (Plug, Ecto.Repo, Oban.Worker) — they are what the
      # analyses detect — and would fail the check by design.
      - name: Compile
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: dev

      # The peer and Mix-project tests (`:project`) run here too; they
      # have a job of their own below only to be rerun alone. The corpus
      # runs nightly, in corpus.yml: cold, it compiles every tree it
      # checks.
      - name: Run tests
        run: mix test --include identity_verify --exclude corpus

  project:
    name: Project tests (Mix compiler, driver, peers)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Install Souffle
        run: |
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-1.19.4-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.19.4-

      - name: Install dependencies
        run: mix deps.get

      - name: Run the project tests
        run: mix test --only project

  parity:
    name: Parity (graph ≡ batch)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Install Souffle
        run: |
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-1.19.4-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.19.4-

      - name: Install dependencies
        run: mix deps.get

      # The incremental≡fresh gate over argus's own fixtures, cold and
      # across cross-module edits (the corpus runs nightly, corpus.yml).
      - name: Run the parity gate
        run: mix test --only parity

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Create PLTs directory
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mkdir -p priv/plts

      - name: Run dialyzer
        run: mix dialyzer

  # The argus escript and the rebar3 plugin, built from this commit and
  # run as users run them: the escript from outside the repository over
  # the fixture projects, the fixtures built by rebar3 and gleam
  # themselves, and `rebar3 argus` against the escript just built.
  escript:
    name: Escript and rebar3 plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir, rebar3 and Gleam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"
          rebar3-version: "3.25.1"
          gleam-version: "1.14.0"

      - name: Install Souffle
        run: |
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-escript-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-escript-

      - name: Install dependencies
        run: mix deps.get

      - name: Build the escript
        run: mix escript.build
        env:
          MIX_ENV: prod

      - name: Run the escript from outside the repository
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/argus" version
          "$GITHUB_WORKSPACE/argus" list > /dev/null

      - name: Compile the rebar3 plugin
        working-directory: integrations/rebar3_argus
        run: rebar3 compile

      - name: Run the escript, rebar3, gleam and plugin tests
        run: >-
          mix test --include escript --include rebar3 --include gleam
          test/argus/escript_test.exs test/integrations

      - name: Keep the escript
        uses: actions/upload-artifact@v4
        with:
          name: argus-escript
          path: argus
